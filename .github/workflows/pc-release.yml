name: PC apps (Радио + Рация)

# Собирает установщики «Радио» (станция + рация) и «Рация» (отдельный виджет) для Windows
# из radio-air-PC и публикует их ДВУМЯ ОТДЕЛЬНЫМИ релизами — станция и рация обновляются независимо:
#   • «Радио»  → релиз vX.Y.Z (обычный, latest), манифест latest.yml, канал по умолчанию.
#   • «Рация» → релиз vX.Y.Z-walkie.0 (пометка pre-release), манифест walkie.yml, канал walkie.
# electron-updater каждой программы берёт свой трек: станция — последний обычный релиз, рация —
# последний релиз своего walkie-канала (см. allowPrerelease в main.js).
# Ручной запуск (workflow_dispatch): выбор «что релизить» (обе / только станция / только рация) и
# галочка publish. Так станцию и рацию можно выпускать раздельно, разными запусками. Без publish —
# только сборка в артефакты.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Что релизить
        type: choice
        options: [both, station, walkie]
        default: both
      publish:
        description: Опубликовать релиз (создаются теги из версий в package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'yes' || 'no' }}
      # На пуш тега собираем и станцию, и рацию; при ручном запуске — что выбрали (по умолчанию обе)
      TARGET: ${{ inputs.target || 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ───────── ffmpeg для станции: качаем win64-бинарь в desktop/vendor ДО сборки, ─────────
      # чтобы extraResources (filter ffmpeg*) вшил его в установщик. Сам бинарь не коммитим (.gitignore).
      - name: Fetch ffmpeg (Радио)
        if: env.TARGET != 'walkie'
        run: |
          mkdir -p radio-air-PC/desktop/vendor
          curl -L --retry 3 -o "$RUNNER_TEMP/ff.gz" https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz
          gunzip -c "$RUNNER_TEMP/ff.gz" > radio-air-PC/desktop/vendor/ffmpeg.exe
          ls -la radio-air-PC/desktop/vendor/ffmpeg.exe

      # ───────── Сборка (без публикации; electron-builder всё равно пишет latest.yml/walkie.yml) ─────────
      - name: Install deps (Радио)
        if: env.TARGET != 'walkie'
        working-directory: radio-air-PC/desktop
        run: npm ci --no-audit --no-fund

      - name: Build Радио
        if: env.TARGET != 'walkie'
        working-directory: radio-air-PC/desktop
        run: npx electron-builder --win --publish never

      - name: Stage Рация sources
        if: env.TARGET != 'station'
        working-directory: radio-air-PC
        run: python pack_walkie.py

      - name: Install deps (Рация)
        if: env.TARGET != 'station'
        working-directory: radio-air-PC/release/radio-walkie
        run: npm ci --no-audit --no-fund

      - name: Build Рация
        if: env.TARGET != 'station'
        working-directory: radio-air-PC/release/radio-walkie
        run: npx electron-builder --win --publish never

      # ───────── Теги релизов из версии станции (рация = та же версия + -walkie.0) ─────────
      - name: Release tags
        id: tags
        run: |
          ver=$(node -p "require('./radio-air-PC/desktop/package.json').version")
          echo "station=v${ver}" >> "$GITHUB_OUTPUT"
          echo "walkie=v${ver}-walkie.0" >> "$GITHUB_OUTPUT"

      # ───────── Сбор файлов по двум релизам ─────────
      - name: Collect files
        run: |
          mkdir -p out-station out-walkie
          cp radio-air-PC/desktop/dist/*.exe radio-air-PC/desktop/dist/*.exe.blockmap radio-air-PC/desktop/dist/latest.yml out-station/ 2>/dev/null || true
          cp radio-air-PC/desktop/dist/*.zip out-station/ 2>/dev/null || true
          cp radio-air-PC/release/radio-walkie/dist/*.exe radio-air-PC/release/radio-walkie/dist/*.exe.blockmap radio-air-PC/release/radio-walkie/dist/walkie.yml out-walkie/ 2>/dev/null || true
          echo "── станция ──"; ls -la out-station; echo "── рация ──"; ls -la out-walkie

      # ───────── Публикация: два отдельных релиза, каждый по своему выбору (черновик → опубликовать) ─────────
      - name: Publish releases
        if: env.PUBLISH == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          st='${{ steps.tags.outputs.station }}'
          wk='${{ steps.tags.outputs.walkie }}'
          repo="$GITHUB_REPOSITORY"
          # Разовая чистка старых битых совместных релизов (immutable-релизы можно удалять)
          for t in v0.2.0 v0.2.1 v0.2.2; do gh release delete "$t" --repo "$repo" --yes --cleanup-tag || true; done
          if [ "$TARGET" != walkie ]; then
            # Станция — обычный релиз (latest)
            gh release delete "$st" --repo "$repo" --yes --cleanup-tag || true
            gh release create "$st" --repo "$repo" --target "$GITHUB_SHA" \
              --title "Радио ${st#v}" \
              --notes "Станция «Радио» для Windows (в неё встроена и рация). Обновляется сама." \
              --draft out-station/*
            gh release edit "$st" --repo "$repo" --draft=false --latest
          fi
          if [ "$TARGET" != station ]; then
            # Рация — отдельный релиз своего канала (pre-release, чтобы не мешать треку станции)
            gh release delete "$wk" --repo "$repo" --yes --cleanup-tag || true
            gh release create "$wk" --repo "$repo" --target "$GITHUB_SHA" \
              --title "Рация ${wk#v}" \
              --notes "Отдельная «Рация» для Windows (виджет на рабочий стол). Обновляется сама, отдельно от станции." \
              --prerelease --draft out-walkie/*
            gh release edit "$wk" --repo "$repo" --draft=false --prerelease
          fi

      # ───────── Артефакты (для ручного запуска без публикации) ─────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pc-installers
          path: |
            out-station/*.exe
            out-station/*.zip
            out-walkie/*.exe
          if-no-files-found: warn
